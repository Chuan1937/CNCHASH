name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The per-page metadata reads the last Git commit for each source
          # file, so the documentation job must have the complete history.
          fetch-depth: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install sphinx sphinx-rtd-theme myst-parser
      - name: Build documentation (English)
        run: sphinx-build -b html docs/en docs/_build/html
      - name: Build documentation (Chinese)
        run: sphinx-build -b html docs/zh_CN docs/_build/html/zh_CN
      - name: Disable Jekyll
        run: touch docs/_build/html/.nojekyll
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5

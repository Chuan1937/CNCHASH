{% set name = "cnchash" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  # The Fortran/OpenMP core is compiled explicitly in build.sh/bld.bat
  # with the conda toolchain, then shipped inside the installed package.

requirements:
  build:
    - {{ compiler('fortran') }}
    - cmake >=3.16
    - make  # [unix]
  host:
    - python
    - pip
    - setuptools >=61
    - wheel
  run:
    - python
    - numpy >=1.20
    # OpenMP runtime: the compiler run_exports no longer add it, so
    # declare it explicitly on both platforms.
    - _openmp_mutex  # [linux]
    - llvm-openmp  # [osx]

test:
  imports:
    - cnchash

about:
  home: https://github.com/Chuan1937/CNCHASH
  license: BSD-3-Clause
  license_file: LICENSE
  summary: >-
    High-performance HASH earthquake focal-mechanism solver with a Modern
    Fortran/OpenMP native backend and a clean Python front-end.
  description: >-
    CNCHASH determines earthquake focal mechanisms from P-wave polarities
    and optional S/P amplitude ratios using the HASH algorithm (Hardebeck
    and Shearer, 2002, 2003). All computation runs in a Modern
    Fortran/OpenMP core (libhashhp); the Python layer handles data, file
    formats, and the API.
  doc_url: https://chuan1937.github.io/CNCHASH/
  dev_url: https://github.com/Chuan1937/CNCHASH

extra:
  recipe-maintainers:
    - Chuan1937
